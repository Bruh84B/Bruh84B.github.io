<meta charset="utf-8">
<title>Пульт</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0E13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#0C0E13; --panel:#141826; --panel2:#1B2033; --line:#262D45;
    --text:#EAE8E1; --muted:#8B90A5; --dim:#5A6078;
    --amber:#F2A93B; --amber-soft:rgba(242,169,59,.14); --amber-line:rgba(242,169,59,.35);
    --green:#5BC98F; --blue:#6FA8F5; --pink:#E38FB4; --gold:#E8C558; --violet:#A28BF0; --coral:#F08D6E; --teal:#63C7BE;
    --r:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.55; min-height:100vh;
  }
  .wrap{max-width:520px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
  /* ---------- header ---------- */
  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px}
  .logo{font-family:"Unbounded",sans-serif; font-weight:700; font-size:20px; letter-spacing:.06em; color:var(--text)}
  .logo span{color:var(--amber)}
  .datefmt{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted)}
  .greet{color:var(--muted); font-size:14.5px; margin-bottom:6px}
  .greet b{color:var(--text); font-weight:600}
  .yline{color:var(--dim); font-size:13px; margin-bottom:16px}
  /* ---------- cards ---------- */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px 16px; margin-bottom:14px}
  .eyebrow{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .eyebrow .led{width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); flex:none}
  .eyebrow .led.flash{animation:ledflash .7s ease 2}
  @keyframes ledflash{0%,100%{box-shadow:0 0 8px var(--amber)}50%{box-shadow:0 0 22px var(--amber)}}
  h2{font-family:"Unbounded",sans-serif; font-weight:600; font-size:19px; line-height:1.3; text-wrap:balance; margin-bottom:8px}
  .chip{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.08em; padding:3px 9px; border-radius:99px; border:1px solid; text-transform:uppercase}
  p.body{color:var(--text); font-size:15.5px}
  p.mut{color:var(--muted); font-size:14px}
  /* ---------- collapsed line-cards ---------- */
  .cardline{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 16px; margin-bottom:14px; cursor:pointer; min-height:48px}
  .cardline .cl-cap{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); flex:none}
  .cardline .cl-txt{font-size:14px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cardline .cl-txt.dim{color:var(--muted)}
  .cardline .ar{color:var(--dim); flex:none}
  /* ---------- banner ---------- */
  .banner{background:var(--amber-soft); border:1px solid var(--amber-line); border-radius:var(--r); padding:13px 16px; margin-bottom:14px}
  .banner b{color:var(--amber); font-family:"Unbounded",sans-serif; font-size:14px; font-weight:600}
  .banner p{font-size:13.5px; color:var(--muted); margin-top:3px}
  /* ---------- soundcheck faders ---------- */
  .faders{display:flex; gap:10px; justify-content:space-between; margin-top:14px}
  .fader{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 4px 8px; cursor:pointer; text-align:center; transition:border-color .15s, background .15s; min-height:44px}
  .fader .bars{display:flex; flex-direction:column-reverse; gap:3px; align-items:center; height:52px; justify-content:flex-start; margin-bottom:7px}
  .fader .bar{width:20px; height:8px; border-radius:2px; background:var(--line)}
  .fader .lbl{font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--muted); line-height:1.2}
  .fader.on{border-color:var(--amber-line); background:var(--amber-soft)}
  .fader.on .bar.lit{background:var(--amber); box-shadow:0 0 6px rgba(242,169,59,.5)}
  .fader:active{border-color:var(--amber-line)}
  @media (hover:hover){ .fader:hover{border-color:var(--amber-line)} }
  /* ---------- mission ---------- */
  .mission{display:flex; gap:12px; align-items:flex-start; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:13px 13px; margin-top:10px; cursor:pointer; transition:border-color .15s}
  .mission:active{border-color:var(--amber-line)}
  @media (hover:hover){ .mission:hover{border-color:var(--amber-line)} }
  .mission .tick{flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--dim); margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--bg); transition:all .15s}
  .mission.done .tick{background:var(--amber); border-color:var(--amber)}
  .mission.done .txt{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--dim)}
  .mission .txt{font-size:15px}
  .mission .meta{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--dim); margin-top:4px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .mission .hint{font-size:12.5px; color:var(--teal); margin-top:3px}
  /* ---------- strength ---------- */
  .str-name{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px}
  .rankbox{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--amber); border:1px solid var(--amber-line); border-radius:8px; padding:2px 8px}
  .action-box{background:var(--amber-soft); border:1px solid var(--amber-line); border-radius:12px; padding:13px 14px; margin-top:12px}
  .action-box .cap{font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:.12em; color:var(--amber); text-transform:uppercase; margin-bottom:6px}
  .blind{border-left:3px solid var(--line); padding-left:12px; margin-top:12px; color:var(--muted); font-size:13.5px}
  /* ---------- buttons ---------- */
  .btn{display:inline-block; font-family:"Golos Text",sans-serif; font-weight:600; font-size:14.5px; background:var(--amber); color:#1A1206; border:none; border-radius:10px; padding:12px 20px; min-height:44px; cursor:pointer; margin-top:12px}
  .btn:active{filter:brightness(1.12)}
  @media (hover:hover){ .btn:hover{filter:brightness(1.08)} }
  .btn.ghost{background:transparent; color:var(--amber); border:1px solid var(--amber-line)}
  .btn.small{padding:10px 16px; font-size:14px; margin-top:8px}
  .btn:disabled{opacity:.45; cursor:default}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap}
  .done-note{display:flex; align-items:center; gap:8px; color:var(--green); font-size:14px; font-weight:500; margin-top:12px}
  /* ---------- textarea / inputs ---------- */
  textarea{width:100%; min-height:96px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; color:var(--text); font-family:"Golos Text",sans-serif; font-size:16px; line-height:1.5; padding:12px; resize:vertical; margin-top:10px}
  textarea:focus{outline:none; border-color:var(--amber-line)}
  input[type=text]{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--text); font-family:"Golos Text",sans-serif; font-size:16px; padding:11px 12px; margin-top:10px}
  input[type=text]:focus{outline:none; border-color:var(--amber-line)}
  select{background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--text); font-family:"Golos Text",sans-serif; font-size:16px; padding:10px 12px; margin-top:10px}
  .savestate{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--dim); margin-top:6px; min-height:14px}
  /* ---------- rhythm ---------- */
  .rhythm{display:flex; align-items:center; gap:14px}
  .leds{display:flex; gap:7px}
  .rled{width:14px; height:14px; border-radius:4px; background:var(--panel2); border:1px solid var(--line)}
  .rled.on{background:var(--amber); border-color:var(--amber); box-shadow:0 0 8px rgba(242,169,59,.55)}
  .rled.today{outline:2px solid var(--amber-line); outline-offset:2px}
  .compound{font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--amber); white-space:nowrap}
  /* ---------- tabs ---------- */
  nav{position:fixed; bottom:0; left:0; right:0; background:rgba(12,14,19,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); z-index:10; padding-bottom:env(safe-area-inset-bottom)}
  .tabs{max-width:520px; margin:0 auto; display:flex}
  .tab{flex:1; text-align:center; padding:11px 0 13px; cursor:pointer; color:var(--dim); font-size:12px; font-weight:500; border:none; background:none; font-family:"Golos Text",sans-serif}
  .tab .ico{font-size:19px; display:block; margin-bottom:2px; filter:grayscale(1) opacity(.55)}
  .tab.active{color:var(--amber)}
  .tab.active .ico{filter:none}
  .tab:focus-visible{outline:2px solid var(--amber-line); outline-offset:-2px; border-radius:8px}
  /* ---------- path ---------- */
  .level-line{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .level-name{font-family:"Unbounded",sans-serif; font-weight:600; font-size:18px}
  .xp-num{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted)}
  .xpbar{height:10px; background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .xpbar i{display:block; height:100%; background:linear-gradient(90deg,#C77E1F,var(--amber)); border-radius:99px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center}
  .stat .n{font-family:"JetBrains Mono",monospace; font-size:20px; font-weight:600; color:var(--text)}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:2px}
  .heat{display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:4px}
  .hcell{width:13px; height:13px; border-radius:3px; background:var(--panel2); border:1px solid var(--line)}
  .hcell.on{background:var(--amber); border-color:var(--amber)}
  .hcell.future{opacity:.25}
  .meters{display:flex; flex-direction:column; gap:9px; margin-top:12px}
  .meter{display:flex; align-items:center; gap:10px}
  .meter .ml{width:118px; flex:none; font-size:13px; color:var(--muted)}
  .meter .track{flex:1; height:9px; background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .meter .fill{display:block; height:100%; border-radius:99px}
  .meter .mn{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); width:28px; text-align:right}
  .spark{width:100%; height:auto; display:block; margin-top:10px}
  /* ---------- journal ---------- */
  .j-entry{border-bottom:1px solid var(--line); padding:14px 0}
  .j-entry:last-child{border-bottom:none}
  .j-date{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--amber); margin-bottom:5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .j-q{color:var(--muted); font-size:13.5px; margin-bottom:4px}
  .j-a{font-size:15px; white-space:pre-wrap}
  .energy-pill{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px}
  /* ---------- profile ---------- */
  .s-item{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--panel2)}
  .s-head{display:flex; align-items:center; gap:11px; padding:12px 13px; cursor:pointer; min-height:48px}
  .s-head .rk{font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--amber); width:24px; flex:none; text-align:right}
  .s-head .nm{font-weight:600; font-size:15.5px; flex:1}
  .s-head .ar{color:var(--dim); transition:transform .2s}
  .s-item.open .s-head .ar{transform:rotate(90deg)}
  .s-body{display:none; padding:0 13px 14px; border-top:1px solid var(--line)}
  .s-item.open .s-body{display:block}
  .s-body p{margin-top:10px; font-size:14.5px}
  /* ---------- people / custom lists ---------- */
  .p-row{display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding:8px 0}
  .p-row:last-child{border-bottom:none}
  .p-name{font-weight:600; font-size:15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .p-name.thin{font-weight:400; font-size:14px; color:var(--muted)}
  .p-days{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); flex:none}
  .p-btn{flex:none; background:var(--panel2); color:var(--amber); border:1px solid var(--amber-line); border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; font-family:"Golos Text",sans-serif; cursor:pointer; min-height:44px}
  .p-del{flex:none; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; padding:10px; min-width:44px; min-height:44px}
  .backup-box{width:100%; min-height:80px; font-family:"JetBrains Mono",monospace; font-size:12px}
  /* ---------- misc ---------- */
  .quiet-note{background:linear-gradient(135deg,rgba(111,168,245,.10),rgba(162,139,240,.10)); border:1px solid rgba(111,168,245,.3); border-radius:var(--r); padding:14px 15px; margin-bottom:14px; font-size:14.5px}
  .quiet-note b{color:var(--blue)}
  .echo{border-left:3px solid var(--teal); padding-left:12px; margin-top:8px}
  .echo .e-old{color:var(--muted); font-size:14px; font-style:italic; white-space:pre-wrap}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom)); background:var(--panel2); border:1px solid var(--amber-line); color:var(--text); border-radius:12px; padding:10px 18px; font-size:14px; z-index:20; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap}
  .toast.show{opacity:1}
  .footer-note{color:var(--dim); font-size:12px; text-align:center; margin-top:20px; line-height:1.5}
  .breath{width:64px; height:64px; border-radius:50%; border:2px solid var(--teal); margin:14px auto 6px; animation:breathe 10s ease-in-out infinite}
  @keyframes breathe{0%{transform:scale(.6); opacity:.6} 40%{transform:scale(1); opacity:1} 100%{transform:scale(.6); opacity:.6}}
  .breath-cap{text-align:center; color:var(--muted); font-size:13px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

<div class="wrap" id="app"></div>
<nav><div class="tabs" id="tabs"></div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= DATA ================= */

const DOMAINS = {
  RB:{name:"Отношения", color:"var(--pink)"},
  ST:{name:"Стратегия", color:"var(--blue)"},
  EX:{name:"Исполнение", color:"var(--green)"},
  IN:{name:"Влияние", color:"var(--violet)"},
};

const STRENGTHS = [
 {rank:1, key:"individualization", name:"Индивидуализация", dom:"RB",
  insight:"Ты видишь людей насквозь: кто чем живёт, кого что заводит и почему. На площадке это твой суперрадар — ты знаешь, кому из операторов что можно доверить, а кого куда не ставить. Люди чувствуют, что ты видишь их настоящими.",
  actions:[
   "Заметь сегодня у одного человека сильную сторону, которую он сам в себе не видит, — и скажи ему об этом. Одной фразой.",
   "Подумай, кому в команде дать задачу, которая идеально ляжет именно на его характер. И сделай так.",
   "Ты хорошо читаешь других. Сегодня наоборот: расскажи кому-то из близких одну вещь о себе, которую он не знает."],
  blind:"Ты знаешь о людях больше, чем они о тебе. Не жди, что догадаются, что тебе нужно, — говори прямо."},
 {rank:2, key:"strategic", name:"Стратегичность", dom:"ST",
  insight:"Там, где другие видят один путь, ты видишь три. Ты быстро просчитываешь варианты и редко попадаешь в тупик — поэтому на шоу тебя не застать врасплох. Это твой главный инструмент и в работе, и в деньгах.",
  actions:[
   "Возьми одну задачу, которая давно висит, и выпиши три разных способа её решить. Выбери один — и сделай первый шаг сегодня.",
   "10 минут наедине с собой: куда ты хочешь прийти через год? Запиши три сценария — плохой, нормальный, отличный.",
   "Перед следующим решением по деньгам просчитай план Б. Ты силён именно в этом — пользуйся."],
  blind:"Ты считаешь варианты так быстро, что со стороны это похоже на «с потолка». Иногда объясняй ход мысли — тебя начнут слышать лучше."},
 {rank:3, key:"relator", name:"Близость", dom:"RB",
  insight:"Тебе не нужна толпа — тебе нужны свои. Несколько человек, которые знают тебя настоящего и на которых можно опереться. Рядом с ними ты работаешь лучше и живёшь спокойнее. Это не слабость, это твоя опора.",
  actions:[
   "Напиши одному из своих — не по делу, просто так. Два сообщения, без повода.",
   "Позови близкого человека на что-то простое: кофе, прогулка, велосипед. Один на один.",
   "Вспомни, кому из «своих» ты давно не отвечал. Ответь сегодня."],
  blind:"Новым людям ты кажешься закрытым. Это нормально — но иногда круг стоит чуть приоткрывать."},
 {rank:4, key:"ideation", name:"Генератор идей", dom:"ST",
  insight:"Рутина тебя глушит, идеи — заряжают. Ты соединяешь несвязанное и придумываешь то, до чего другие не додумаются. Скука для тебя — сигнал, что пора что-то поменять, а не норма жизни.",
  actions:[
   "Запиши пять идей, как заработать с помощью AI на том, что ты уже умеешь. Без цензуры, любые.",
   "Поменяй сегодня одну мелочь в рутине: маршрут, место, порядок дел. Посмотри, что заметишь.",
   "Возьми одну свою старую идею и раскрути на шаг дальше: что нужно, чтобы проверить её за неделю?"],
  blind:"Идей у тебя больше, чем доведённых до конца. Не разбрасывайся — выбери одну и дожми."},
 {rank:5, key:"deliberative", name:"Осмотрительность", dom:"EX",
  insight:"Ты не бросаешься в омут — ты сначала думаешь. Видишь риски, которые другие не замечают, и потому редко жалеешь о решениях. Это не медлительность. Это зрелость.",
  actions:[
   "20 минут тишины: разбери одно висящее решение. Риски, цена, что будет, если не делать вообще.",
   "Сегодня скажи «мне нужно подумать» там, где тебя торопят. Это твоё право, а не слабость.",
   "Проверь одну финансовую мелочь, которую откладывал: подписка, платёж, ставка. Меньше тумана — меньше риска."],
  blind:"Твою осторожность путают со страхом. Отвечай: «я не боюсь — я считаю»."},
 {rank:6, key:"empathy", name:"Эмпатия", dom:"RB",

const KEY = "pult_v1";
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      try{
        const o = JSON.parse(raw);
        if(o && typeof o === "object"){
          o.days = o.days||{}; o.people = o.people||[]; o.weeks = o.weeks||{};
          o.customMissions = o.customMissions||[]; o.customQuestions = o.customQuestions||[];
          return o;
        }
      }catch(parseErr){
        /* битый JSON не выбрасываем: прячем сырую строку, чтобы данные можно было спасти вручную */
        try{ localStorage.setItem(KEY+"_broken_"+Date.now(), raw); }catch(e2){}
      }
    }
  }catch(e){}
  return {days:{}, people:[], weeks:{}, customMissions:[], customQuestions:[], lastVisit:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayNum(key){
  const [y,m,d] = key.split("-").map(Number);
  return Math.floor(Date.UTC(y, m-1, d)/86400000);
}
function keyOfNum(n){ return new Date(n*86400000).toISOString().slice(0,10); }
function day(key){
  if(!S.days[key]) S.days[key] = {energy:null, missions:{}, strengthDone:false, answer:"", weekly:"", scXp:false};
  return S.days[key];
}
function isActive(rec){
  if(!rec) return false;
  return rec.strengthDone || !!rec.answer || !!rec.weekly || !!rec.lightsOut || Object.values(rec.missions||{}).some(Boolean);
}
function dayComplete(rec){
  return rec && rec.energy!==null && (!!rec.answer || Object.values(rec.missions||{}).some(Boolean));
}
function weekKeyOf(dateKey){
  const [y,m,d] = dateKey.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  const dow = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate() - dow + 3);
  const firstThu = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const fdow = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate() - fdow + 3);
  const wk = 1 + Math.round((dt - firstThu)/(7*86400000));
  return dt.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");
}

/* deterministic prng */
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function missionPool(){ return MISSIONS.concat(S.customMissions||[]); }
function questionPool(){ return QUESTIONS.concat(S.customQuestions||[]); }

function dailyPick(key){
  const dn = dayNum(key);
  const rnd = mulberry32(dn*7919);
  const strength = STRENGTHS[dn % STRENGTHS.length];
  const action = strength.actions[Math.floor(rnd()*strength.actions.length)];
  const catKeys = Object.keys(CATS).filter(c=>c!=="rest");
  const shuffled = catKeys.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  const pool = missionPool();
  const missions = shuffled.slice(0,3).map(c=>{
    const p = pool.filter(m=>m.cat===c);
    return p[Math.floor(rnd()*p.length)];
  });
  const restMissions = (()=>{ const r=mulberry32(dn*104729); const p=REST_MISSIONS.slice();
    for(let i=p.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } return p.slice(0,3); })();
  const qp = questionPool();
  const question = qp[dn % qp.length];
  return {strength, action, missions, restMissions, question};
}

/* фиксируем контент дня в записи — история не «переезжает» при росте пулов */
function ensureDayContent(key){
  const rec = day(key);
  let dirty = false;
  const p = (!rec.setlist || !rec.restlist || !rec.q || !rec.sAction) ? dailyPick(key) : null;
  if(!rec.setlist){ rec.setlist = p.missions.map(m=>({cat:m.cat, min:m.min, text:m.text})); dirty = true; }
  if(!rec.restlist){ rec.restlist = p.restMissions.map(m=>({cat:m.cat, min:m.min, text:m.text})); dirty = true; }
  if(!rec.q){ rec.q = p.question; dirty = true; }
  if(!rec.sAction){ rec.sAction = p.action; dirty = true; }
  if(dirty) save();
  return rec;
}

/* ---- XP: монотонный счёт. Начислили — навсегда; снятие галочки ничего не отнимает. ---- */
function computeLegacyXp(){
  let xp = 0;
  for(const k in S.days){
    const r = S.days[k];
    if(r.scXp) xp += XP.soundcheck;
    if(r.strengthDone) xp += XP.strength;
    if(r.answer) xp += XP.answer;
    if(r.weekly) xp += XP.weekly;
    if(r.lightsOut) xp += XP.sleep;
    xp += Object.values(r.missions||{}).filter(Boolean).length * XP.mission;
  }
  xp += Object.keys(S.weeks||{}).length * XP.weekly;
  return xp;
}
function totalXp(){
  if(typeof S.xp !== "number"){ S.xp = computeLegacyXp(); save(); }
  return S.xp;
}
function award(points){ totalXp(); S.xp += points; save(); }
function awardOnce(rec, tag, points){
  rec.xpAwarded = rec.xpAwarded || {};
  if(rec.xpAwarded[tag]) return false;
  rec.xpAwarded[tag] = true;
  award(points);
  return true;
}
function levelFor(xp){
  let cur = LEVELS[0], next = null;
  for(let i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].xp) cur = LEVELS[i]; else { next = LEVELS[i]; break; } }
  return {cur, next};
}
function activeDaysCount(){ return Object.keys(S.days).filter(k=>isActive(S.days[k])).length; }
function lastActiveDayBefore(dn){
  let best = null;
  for(const k in S.days){
    const n = dayNum(k);
    if(n < dn && isActive(S.days[k]) && (best===null || n > best)) best = n;
  }
  return best;
}

function draftKey(kind, scope){ return "pult_draft_"+kind+"_"+(scope||todayKey()); }
function getDraft(kind, scope){ try{ return localStorage.getItem(draftKey(kind, scope))||""; }catch(e){ return ""; } }

/* при старте: вчерашний несохранённый ответ дописываем в его день, мусор чистим */
function sweepDrafts(){
  const tk = todayKey();
  let keys = [];
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf("pult_draft_")===0) keys.push(k); } }catch(e){ return; }
  for(const k of keys){
    const parts = k.split("_"); /* pult, draft, kind, scope */
    const kind = parts[2], scope = parts.slice(3).join("_");
    if(kind==="weekly" && scope.indexOf("W")!==-1) continue; /* новый формат — по неделе, живёт до закрытия */
    if(scope === tk) continue;
    let val = "";
    try{ val = localStorage.getItem(k)||""; }catch(e){}
    if(kind==="answer" && val && /^\d{4}-\d{2}-\d{2}$/.test(scope) && S.days[scope] && !S.days[scope].answer){
      /* ответ, набранный до полуночи и не сохранённый — дописываем в его день */
      S.days[scope].answer = val.trim();
      awardOnce(S.days[scope], "answer", XP.answer);
      save();
    }
    if(kind==="weekly" && val && /^\d{4}-\d{2}-\d{2}$/.test(scope)){
      /* старый формат черновика недели — переносим под ключ недели, если она не закрыта */
      const wk = weekKeyOf(scope);
      if(!S.weeks[wk] && !getDraft("weekly", wk)) setDraft("weekly", val, wk);
    }
    try{ localStorage.removeItem(k); }catch(e){}
  }
}

function viewToday(){

  const dn = dayNum(tk);
  const h = new Date().getHours();
  const phase = (h>=17 || h<5) ? "evening" : (h<12 ? "morning" : "day");
  const scDone = rec.energy !== null;
  const quiet = ((scDone && rec.energy <= 2) || !!rec.quietOn) && !rec.quietOff;

  /* возвращение и «вчера» — считаем по последнему АКТИВНОМУ дню, без укора */
  let backLine = "";
  if(!isActive(rec) && !scDone){
    const lastAct = lastActiveDayBefore(dn);
    const gap = lastAct===null ? (S.lastVisit ? dn - dayNum(S.lastVisit) : 0) : dn - lastAct;
    if(gap >= 3){
      backLine = "Начинаем с сегодня. Что было — было.";
    } else {
      const y = S.days[keyOfNum(dn-1)];
      if(y && isActive(y)){
        const n = Object.values(y.missions||{}).filter(Boolean).length;
        backLine = `Вчера: ${y.energy?("энергия «"+ELBL[y.energy]+"», "):""}задач ${n}${y.answer?", запись есть":""}.`;
      } else if(S.lastVisit){
        backLine = "Вчера был тихий эфир — ничего не сгорело.";
      }
    }
  }
  if(S.lastVisit !== tk){ S.lastVisit = tk; save(); }

  /* детектор отката: последние два отмеченных дня ≤2 */
  let quietSuggest = "";
  if(!scDone && !rec.quietOn && !rec.quietAsked){
    const marked = [];
    for(let i=1;i<=7 && marked.length<2;i++){
      const r = S.days[keyOfNum(dn-i)];
      if(r && r.energy!==null) marked.push(r.energy);
    }
    if(marked.length===2 && marked[0]<=2 && marked[1]<=2){
      quietSuggest = `<div class="quiet-note"><b>Похоже, последние дни были тяжёлые.</b> Включить тихий режим — без подвигов, только мягкие задачи?
        <div class="btnrow"><button class="btn small" data-act="quieton">Включить</button><button class="btn ghost small" data-act="quietno">Обычный день</button></div></div>`;
    }
  }

  let html = headerHtml();
  html += `<p class="greet">${greeting()}, <b>Батыр</b>. ${quiet ? "Сегодня — тихий день. Без подвигов." : "Пульт включён — день твой."}</p>`;
  html += backLine ? `<p class="yline">${backLine}</p>` : `<div style="height:12px"></div>`;
  html += `<div id="banner-slot">${bannerHtml(rec)}</div>`;
  html += browserHintHtml();
  html += quietSuggest;

  if(quiet && scDone){
    html += `<div class="quiet-note"><b>Режим восстановления.</b> Энергии мало — и это нормально: у тебя бывают циклы. Апатия сегодня не значит, что амбиций нет. Пульт убрал всё лишнее. Отдых — это тоже работа над собой.
      <div class="btnrow"><button class="btn ghost small" data-act="quietoff">Вернуть обычный день</button></div></div>`;
  }

  const cards = [];
  cards.push(scCardHtml(rec, scDone));
  const mp = morningPlanCardHtml(); if(mp) cards.push(mp);
  if(phase==="evening" && !rec.answer) cards.push(questionCardHtml(rec, phase));
  cards.push(setlistCardHtml(rec, quiet));
  cards.push(strengthCardHtml(rec, quiet));
  if(!(phase==="evening" && !rec.answer)) cards.push(questionCardHtml(rec, phase));
  const wkC = weeklyCardHtml(); if(wkC) cards.push(wkC);
  if(phase==="evening"){ const e = echoCardHtml(); if(e) cards.push(e); }
  const sl = sleepCardHtml(rec); if(sl) cards.push(sl);
  cards.push(rhythmHtml());

  html += cards.join("");
  html += `<p class="footer-note">Все данные хранятся только на этом устройстве. Резервная копия — во вкладке «Я».</p>`;
  return html;
}

/* ---------- Путь ---------- */

function viewPath(){
  const xp = totalXp();
  const {cur, next} = levelFor(xp);
  const progress = next ? Math.round(((xp-cur.xp)/(next.xp-cur.xp))*100) : 100;
  const total = activeDaysCount();
  let missionsDone = 0, answers = 0, lights = 0;
  for(const k in S.days){ const r=S.days[k]; missionsDone += Object.values(r.missions||{}).filter(Boolean).length; if(r.answer) answers++; if(r.weekly) answers++; if(r.lightsOut) lights++; }
  answers += Object.keys(S.weeks||{}).length;

  let html = headerHtml();

  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Артефакты</div>
    <div class="stats">
      <div class="stat"><div class="n">${answers}</div><div class="l">записей</div></div>
      <div class="stat"><div class="n">${missionsDone}</div><div class="l">задач сделано</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">активных дней</div></div>
    </div>
    <p class="mut" style="margin-top:10px">Это факты о тебе. Они накапливаются и не сгорают — их нельзя обесценить.</p></div>`;

  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Уровень</div>
    <div class="level-line"><span class="level-name">${cur.name}</span><span class="xp-num">${xp} XP${next?` / ${next.xp}`:""}</span></div>
    <div class="xpbar"><i style="width:${progress}%"></i></div>
    ${next?`<p class="mut" style="margin-top:8px">До уровня «${next.name}» — ${next.xp-xp} XP. Уровень не сгорает: всё, что прокачано, — прокачано.</p>`:`<p class="mut" style="margin-top:8px">Максимальный уровень. Ты и есть шоу.</p>`}</div>`;

  const pct = ((Math.pow(1.01, total)-1)*100).toFixed(1);
  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Дни складываются</div>
    <p class="body" style="font-family:'JetBrains Mono',monospace; font-size:26px; color:var(--amber)">+${pct}%</p>
    <p class="mut" style="margin-top:6px">Это не измерение — это символ: напоминание, что дни складываются, а не исчезают. Настоящие цифры — выше, в артефактах.</p></div>`;

  const tk = todayKey(); const dn = dayNum(tk);
  const pts = [];
  const DAYS_BACK = 41;
  for(let i=DAYS_BACK; i>=0; i--){
    const r = S.days[keyOfNum(dn-i)];
    if(r && r.energy!==null) pts.push({x: DAYS_BACK-i, y: r.energy});
  }
  if(pts.length >= 2){
    const W=420, H=90, px = x=> 10 + x*(W-20)/DAYS_BACK, py = y=> H-12 - (y-1)*(H-28)/4;
    const line = pts.map(p=>px(p.x).toFixed(1)+","+py(p.y).toFixed(1)).join(" ");
    const dots = pts.map(p=>`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="3" fill="#F2A93B"/>`).join("");
    html += `<div class="card"><div class="eyebrow"><span class="led"></span>Линия энергии · 6 недель</div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="График энергии">
        <line x1="10" y1="${py(3)}" x2="${W-10}" y2="${py(3)}" stroke="#262D45" stroke-dasharray="3 4"/>
        <polyline points="${line}" fill="none" stroke="#F2A93B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
        ${dots}</svg>
      <p class="mut" style="margin-top:6px">Подъёмы и спады — это цикл, а не характер. Когда линия накопится, ты впервые увидишь его целиком: фаза станет известной величиной, которую можно планировать.</p></div>`;
  }

  const todayDow = (new Date().getDay()+6)%7;
  let cells = "";
  const start = dn - todayDow - 63;
  for(let col=0; col<10; col++){
    for(let row=0; row<7; row++){
      const n = start + col*7 + row;
      const future = n > dn;
      cells += `<span class="hcell ${!future && isActive(S.days[keyOfNum(n)])?"on":""} ${future?"future":""}"></span>`;
    }
  }
  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Карта · 10 недель</div><div class="heat">${cells}</div>
    <p class="mut" style="margin-top:8px">Не гонись за сплошной заливкой. Дыры — это жизнь, а не провал.</p></div>`;

  const counts = {};
  let uncat = 0;
  for(const k in S.days){
    const r = S.days[k]; if(!Object.values(r.missions||{}).some(Boolean)) continue;
    for(const id in r.missions){ if(!r.missions[id]) continue;
      const idx = Number(id.slice(1));
      const list = id[0]==="r" ? (r.restlist||[]) : (r.setlist||[]);
      const m = list[idx];
      if(m) counts[m.cat] = (counts[m.cat]||0)+1; else uncat++;
    }
  }
  const maxc = Math.max(1, ...Object.values(counts), 1);
  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Каналы</div><div class="meters">`;
  for(const c in CATS){
    const n = counts[c]||0;
    html += `<div class="meter"><span class="ml">${CATS[c].name}</span><span class="track"><span class="fill" style="width:${Math.round(n/maxc*100)}%; background:${CATS[c].color}"></span></span><span class="mn">${n}</span></div>`;
  }
  html += `</div><p class="mut" style="margin-top:10px">Куда идёт твоя энергия. Перекос — не ошибка, а информация.${uncat?` (${uncat} ранних задач без категории — до версии 2 они не сохранялись.)`:""}</p></div>`;
  if(lights>0) html += `<p class="footer-note">«Свет погашен» отмечен ${lights} раз — время отбоя копится в дневнике.</p>`;
  return html;
}

  html += `<div class="card"><div class="eyebrow"><span class="led"></span>Дневник · ${keys.length} ${keys.length===1?"день":"дней"}</div>`;

    html += `</div>`;

    }
    html += `</div>`;
  }
  return html;
}

/* ================= EVENTS ================= */

function updateDayDynamic(){
  const rec = day(todayKey());
  const r = $("#card-rhythm");
  if(r){ const tmp = document.createElement("div"); tmp.innerHTML = rhythmHtml(); r.replaceWith(tmp.firstElementChild); }
  const slot = $("#banner-slot");
  if(slot) slot.innerHTML = bannerHtml(rec);
}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{ TAB = el.dataset.tab; EXPANDED.clear(); render(); window.scrollTo(0,0); });

  document.querySelectorAll("[data-expand]").forEach(el=>{
    const fire = ()=>{ if(!guardDay()) return; EXPANDED.add(el.dataset.expand); rerenderKeepScroll(); };
    el.onclick = fire;
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fire(); } };
  });

  document.querySelectorAll("[data-energy]").forEach(el=>el.onclick=()=>{
    if(!guardDay()) return;
    const rec = day(todayKey());
    const first = rec.energy === null;
    rec.energy = Number(el.dataset.energy);
    if(first && !rec.scXp){ rec.scXp = true; award(XP.soundcheck); toast("Саундчек принят · +"+XP.soundcheck+" XP"); buzz(20); }
    EXPANDED.delete("sc");
    save(); rerenderKeepScroll();
  });

  document.querySelectorAll("[data-mission]").forEach(el=>{
    const fire = ()=>{
      if(!guardDay()) return;
      const rec = day(todayKey());
      const id = el.dataset.mission;
      const wasComplete = dayComplete(rec);
      rec.missions[id] = !rec.missions[id];
      const done = !!rec.missions[id];
      if(done) awardOnce(rec, "m_"+id, XP.mission); /* второй раз за ту же задачу XP не даётся, но и не отнимается */
      save();
      el.classList.toggle("done", done);
      el.querySelector(".tick").textContent = done ? "✔" : "";
      if(done){
        buzz(30);
        const led = $("#setlist-led"); if(led){ led.classList.remove("flash"); void led.offsetWidth; led.classList.add("flash"); }
        toast(!wasComplete && dayComplete(rec) ? "Прогон дня отыгран" : "Сделано");
        if(el.dataset.cat==="people"){ rerenderKeepScroll(); return; } /* показать кнопку «отметить контакт» */
      }
      updateDayDynamic();
    };
    el.onclick = fire;
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fire(); } };
  });

  document.querySelectorAll("textarea[data-draft]").forEach(ta=>{
    ta.oninput = ()=>{
      setDraft(ta.dataset.draft, ta.value, ta.dataset.scope);
      const ind = $("#draft-"+ta.dataset.draft);
      if(ind){ ind.textContent = "черновик сохранён"; clearTimeout(ind._t); ind._t = setTimeout(()=>ind.textContent="", 1500); }
    };
  });

  document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
    const act = el.dataset.act;
    if(act!=="backup" && act!=="showbackup" && act!=="restore" && !guardDay()) return;
    const rec = day(todayKey());
    if(act==="strength"){
      if(!rec.strengthDone){ rec.strengthDone = true; awardOnce(rec, "strength", XP.strength); }
      save(); buzz(30); rerenderKeepScroll();
      toast("Сила прокачана · +"+XP.strength+" XP");
    }
    if(act==="saveanswer"){
      const ta = $("#answerta");
      const v = ta ? ta.value.trim() : "";
      if(!v){ toast("Напиши хотя бы пару слов"); return; }
      const had = !!rec.answer;
      const wasComplete = dayComplete(rec);
      rec.answer = v; EDITING.answer = false; setDraft("answer","");
      if(!had) awardOnce(rec, "answer", XP.answer);
      save(); buzz(30); render(); window.scrollTo(0,0);
      toast(had ? "Сохранено" : (!wasComplete && dayComplete(rec) ? "Прогон дня отыгран" : "В дневник · +"+XP.answer+" XP"));
    }
    if(act==="editanswer"){
      EDITING.answer = true; setDraft("answer", rec.answer); rerenderKeepScroll();
      const ta = $("#answerta"); ta && ta.focus();
    }
    if(act==="saveweekly"){
      const ta = $("#weeklyta");
      const v = ta ? ta.value.trim() : "";
      if(!v){ toast("Пара честных строк — и неделя закрыта"); return; }
      const wk = el.dataset.wk;
      const had = !!S.weeks[wk];
      S.weeks[wk] = v; setDraft("weekly","",wk);
      if(!had) award(XP.weekly);
      save(); buzz(30); render(); window.scrollTo(0,0);
      toast("Неделя закрыта · +"+XP.weekly+" XP");
    }
    if(act==="lightsout"){
      const ta = $("#sleepta");
      rec.sleepPlan = ta ? ta.value.trim() : "";
      if(!rec.lightsOut){
        const d = new Date();
        rec.lightsOut = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
        awardOnce(rec, "sleep", XP.sleep);
      }
      setDraft("sleep","");
      save(); buzz(40); rerenderKeepScroll();
      toast("Свет погашен. Тишина в зале.");
    }
    if(act==="quieton"){ rec.quietOn = true; rec.quietOff = false; rec.quietAsked = true; save(); rerenderKeepScroll(); }
    if(act==="quietno"){ rec.quietAsked = true; save(); rerenderKeepScroll(); }
    if(act==="quietoff"){ rec.quietOff = true; rec.quietOn = false; save(); rerenderKeepScroll(); toast("Обычный день. Решаешь ты."); }
    if(act==="hidehint"){ HIDE_BROWSER_HINT = true; rerenderKeepScroll(); }
    if(act==="addperson"){
      const inp = $("#pname"); const v = inp ? inp.value.trim() : "";
      if(!v) return;
      if((S.people||[]).length>=7){ toast("Семь — достаточно"); return; }
      S.people.push({name:v, last:null}); save(); rerenderKeepScroll();
    }
    if(act==="addmission"){
      const t = $("#cm-text"), c = $("#cm-cat");
      const v = t ? t.value.trim() : "";
      if(!v){ toast("Напиши задачу"); return; }
      S.customMissions.push({cat: c.value, min: 15, text: v}); save(); rerenderKeepScroll();
      toast("Трек добавлен в ротацию");
    }
    if(act==="addquestion"){
      const t = $("#cq-text");
      const v = t ? t.value.trim() : "";
      if(!v){ toast("Напиши вопрос"); return; }
      S.customQuestions.push(v); save(); rerenderKeepScroll();
      toast("Вопрос добавлен в банк");
    }
    if(act==="backup" || act==="showbackup"){
      const json = JSON.stringify(S);
      const area = $("#backup-area"), ta = $("#backupta");
      if(act==="backup" && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(()=>toast("Скопировано. Сохрани в заметки."), ()=>{
          if(area && ta){ area.style.display="block"; ta.value=json; ta.select(); toast("Выдели и скопируй вручную"); }
        });
      } else if(area && ta){
        area.style.display = area.style.display==="none" ? "block" : "none";
        ta.value = json;
      }
    }
    if(act==="restore"){
      const ta = $("#importta");
      const v = ta ? ta.value.trim() : "";
      if(!v){ toast("Вставь копию в поле выше"); return; }
      try{
        const o = JSON.parse(v);
        if(!o || typeof o!=="object" || !o.days) throw new Error("bad");
        if(!window.confirm("Заменить текущие данные восстановленной копией?")) return;
        o.days = o.days||{}; o.people = o.people||[]; o.weeks = o.weeks||{};
        o.customMissions = o.customMissions||[]; o.customQuestions = o.customQuestions||[];
        S = o; save(); render(); window.scrollTo(0,0);
        toast("Данные восстановлены");
      }catch(e){ toast("Это не похоже на копию Пульта"); }
    }
  });

  document.querySelectorAll("[data-touch],[data-ptouch]").forEach(el=>el.onclick=()=>{
    if(!guardDay()) return;
    const idx = Number(el.dataset.touch !== undefined ? el.dataset.touch : el.dataset.ptouch);
    const p = S.people[idx];
    if(p){ p.last = todayKey(); save(); rerenderKeepScroll(); toast("Отмечено"); }
  });
  document.querySelectorAll("[data-pdel]").forEach(el=>el.onclick=()=>{
    S.people.splice(Number(el.dataset.pdel),1); save(); rerenderKeepScroll();
  });
  document.querySelectorAll("[data-cmdel]").forEach(el=>el.onclick=()=>{
    S.customMissions.splice(Number(el.dataset.cmdel),1); save(); rerenderKeepScroll();
  });
  document.querySelectorAll("[data-cqdel]").forEach(el=>el.onclick=()=>{
    S.customQuestions.splice(Number(el.dataset.cqdel),1); save(); rerenderKeepScroll();
  });

  document.querySelectorAll(".s-head").forEach(el=>{
    const fire = ()=> el.parentElement.classList.toggle("open");
    el.onclick = fire;
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fire(); } };
  });
}

/* ================= BOOT ================= */

sweepDrafts();

/* диплинки: #soundcheck / #question / #sleep — до первого рендера, без двойной отрисовки */
function applyHash(){
  const h = (location.hash||"").replace("#","");
  if(h==="question") EXPANDED.add("q");
  render();
  const map = {soundcheck:"#card-sc", question:"#card-q", sleep:"#card-sleep"};
  const el = map[h] && document.querySelector(map[h]);
  el && el.scrollIntoView({block:"start"});
}
applyHash();
window.addEventListener("hashchange", applyHash);

/* смена дня, пока приложение живёт в памяти (iOS держит PWA сутками) */
function checkDayRollover(){
  if(RENDERED_KEY && RENDERED_KEY !== todayKey()){
    EXPANDED.clear(); EDITING = {};
    render(); window.scrollTo(0,0);
  }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkDayRollover(); });
window.addEventListener("focus", checkDayRollover);
window.addEventListener("pageshow", checkDayRollover);
</script>

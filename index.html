    if(EXPANDED.has("banned")){
      S.banned.missions.forEach((id,i)=>{
        const m = MISSIONS.concat(S.customMissions||[]).find(x=> mid(x.text) === id);
        h += '<div class="p-row"><span class="p-name thin">'+esc(m ? m.text : id)+'</span><button class="p-btn" data-act="unban-mission" data-i="'+i+'">вернуть</button></div>';
      });
      S.banned.questions.forEach((q,i)=>{
        h += '<div class="p-row"><span class="p-name thin">'+esc(q)+'</span><button class="p-btn" data-act="unban-question" data-i="'+i+'">вернуть</button></div>';
      });
    }
    h += '</div>';
  }

  /* Спасённая копия после битого JSON */
  let brokenKey = null;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(KEY+"_broken_") === 0 && (!brokenKey || k > brokenKey)) brokenKey = k;
    }
  }catch(e){}
  if(brokenKey){
    const ts = Number(brokenKey.slice((KEY+"_broken_").length));
    const when = isFinite(ts) ? fmtDate(new Date(ts).toISOString().slice(0,10)) : "";
    h += '<div class="card">'+eyebrow("Непрочитанная копия")+
      '<p class="mut">Однажды данные не прочитались, и сырая копия была спрятана'+(when?" ("+when+")":"")+'. Она всё ещё здесь.</p>'+
      '<div class="btnrow"><button class="btn ghost small" data-act="broken-try" data-k="'+esc(brokenKey)+'">попробовать восстановить</button>'+
      '<button class="btn ghost small" data-act="broken-share" data-k="'+esc(brokenKey)+'">выгрузить файлом</button>'+
      '<button class="btn quiet small" data-act="broken-del" data-k="'+esc(brokenKey)+'">удалить</button></div></div>';
  }

  /* Резервная копия */
  let snap = null;
  try{ snap = localStorage.getItem(SNAP_KEY); }catch(e){}
  h += '<div class="card">'+eyebrow("Резервная копия")+
    '<p class="mut">'+(S.persisted
      ? "Система закрепила хранилище — сама его не вытеснит."
      : "Система может вытеснить данные при нехватке места. Держи копию.")+'</p>'+
    '<div class="btnrow"><button class="btn small" data-act="backup">Сохранить копию</button>'+
    '<button class="btn ghost small" data-act="show-backup">Показать текстом</button></div>'+
    (EXPANDED.has("backup") ? '<textarea class="backup-box" id="backupta" readonly>'+esc(JSON.stringify(S))+'</textarea>' : '')+
    '<p class="tiny-note">При переезде на новый телефон память установленного Пульта не переезжает сама — резервная копия iPhone её не тянет. Переедет только та копия, которую ты сохранил в Файлы или отправил себе.</p>'+
    '<p class="mut" style="margin-top:14px; margin-bottom:2px">Восстановление из копии:</p>'+
    '<textarea class="backup-box" id="importta" placeholder="Вставь сюда сохранённую копию..."></textarea>'+
    '<button class="btn ghost small" data-act="preview-restore">Проверить копию</button>'+
    (RESTORE_PREVIEW ? '<div class="note" style="margin-top:12px"><p class="mut">'+esc(RESTORE_PREVIEW.text)+'</p>'+
      '<div class="btnrow"><button class="btn small" data-act="restore-merge">Добавить недостающие дни</button>'+
      '<button class="btn ghost small" data-act="restore-replace">Заменить всё</button></div></div>' : '')+
    (snap ? '<div class="minirow"><button class="mini" data-act="undo-replace">откатить восстановление</button></div>' : '')+
    '<div class="minirow"><button class="mini" data-act="wipe-journal">стереть весь дневник</button></div>'+
    (EXPANDED.has("wipe") ? '<input type="text" id="wipeword" placeholder="впиши слово: стереть"><button class="btn ghost small" data-act="wipe-confirm">Стереть</button><p class="tiny-note">Это необратимо.</p>' : '')+
    '</div>';

  h += debtsDataCardHtml();

  /* Почему устроен так */
  h += '<div class="card">'+eyebrow("Почему этот пульт устроен именно так")+
    '<p class="mut" style="margin-bottom:8px"><b style="color:var(--text)">Нет очков и уровней.</b> Они считали нажатия, а не тебя. Осмотрительность №5 раскусила бы это за минуту, и заодно перестала бы верить честным цифрам рядом. Осталось только то, что можно проверить: записи, задачи, дни.</p>'+
    '<p class="mut" style="margin-bottom:8px"><b style="color:var(--text)">Нет стриков.</b> Постоянство у тебя №34, Дисциплина №27 — цепочки «не пропусти ни дня» тебя не мотивируют, а добивают. Пропуск здесь не существует как сущность.</p>'+
    '<p class="mut" style="margin-bottom:8px"><b style="color:var(--text)">Энергия только убирает.</b> Низкая цифра снимает лишнее с экрана и никогда ничего не открывает — иначе фейдер перестал бы быть измерением и ты начал бы его подгонять.</p>'+
    '<p class="mut" style="margin-bottom:8px"><b style="color:var(--text)">День кончается в 5 утра.</b> Ты ложишься в три — значит, написанное в час ночи принадлежит тому дню, который ты ещё живёшь.</p>'+
    '<p class="mut" style="margin-bottom:8px"><b style="color:var(--text)">Сначала отдаёт, потом просит.</b> Твоя же запись из архива стоит выше всех форм ввода. Забывают то, что просит; помнят то, что даёт.</p>'+
    '<p class="mut"><b style="color:var(--text)">Всё разбирается.</b> Свобода у тебя ценность №1, поэтому любой модуль выключается одним тапом, а весь пульт ставится на паузу.</p></div>';

  h += '<div class="card">'+eyebrow("Нижние темы · для честности")+
    '<p class="mut">Внизу твоего профиля: Постоянство (№34), Woo (№33), Коммуникация (№30), Уверенность (№28), Дисциплина (№27). Это не слабости — это то, кем ты не обязан быть. Не строй жизнь, требующую ежедневного нетворкинга, железного распорядка и публичных выступлений. Строй ту, где решают глубина, стратегия и свои люди.</p></div>';

  if(CRISIS){
    h += '<p class="footer-note">Если станет совсем тяжело: '+CRISIS+' — круглосуточно и бесплатно с любого номера. Там есть психологи.</p>';
  }
  h += '<p class="footer-note">Профиль: CliftonStrengths 34 от 10.07.2024 · Всё хранится только на этом устройстве</p>';
  return h;
}
let RESTORE_PREVIEW = null;

/* ================= ДОЛГИ: рендер =================
   КОНТРАКТ ВИДИМОСТИ: модуль присутствует ровно в 4 местах —
   (1) строка+карточки в «Пути»; (2) карточка «Долги · данные» и тумблер в «Я»;
   (3) текст DEBT_MISSION в «Сегодня» (словами, без цифр); (4) больше нигде.
   Ноль уведомлений, бейджей, плашек «обнови»; аптечка данные долгов не читает.
   В свёрнутой строке запрещены: общий остаток, пеня, любые растущие числа. */

let DEBT_FLASH = false;
let DEBTS_PREVIEW = null;

function debtLineText(ctx){
  const sm = debtsSummary(ctx.key);
  const parts = [];
  if(sm.closedCount > 0) parts.push("закрыто "+sm.closedCount+" из "+sm.totalCount);
  if(sm.totalPaid > 0) parts.push("выплачено "+fmtT(sm.totalPaid));
  return parts.length ? parts.join(" · ") : sm.totalCount+" "+plural(sm.totalCount,"долг","долга","долгов")+" · очередь внутри";
}

function debtReason(q0){
  const d = q0.d, c = q0.c;
  if(c.hot && d.penaltyDaily > 0) return "Пеня ≈ "+fmtT(d.penaltyDaily)+"/день, пока он открыт.";
  if(c.hot) return "Просрочка — по твоему правилу он идёт раньше остальных.";
  if(d.kind === "bank" && d.rate) return "Самая дорогая ставка из оставшихся: ~"+Math.round(d.rate)+"%.";
  if(d.kind === "bank") return "Банк — следующий по твоему порядку.";
  return "Самый маленький из оставшихся — закроется быстрее всех.";
}

function debtRowHtml(item, ctx){
  const d = item.d, c = item.c;
  let chip = "";
  if(d.penaltyDaily > 0) chip = '<span class="chip" style="color:var(--coral);border-color:var(--coral)">≈'+Math.round(d.penaltyDaily)+' ₸/д</span>';
  else if(c.hot) chip = '<span class="chip" style="color:var(--coral);border-color:var(--coral)">просрочка</span>';
  else if(d.kind === "bank" && (d.rate||0) >= 3) chip = '<span class="chip" style="color:var(--dim-text);border-color:var(--line-strong)">~'+Math.round(d.rate)+'%</span>';
  else if(d.kind === "bank") chip = '<span class="chip" style="color:var(--dim-text);border-color:var(--line-strong)">0%</span>';
  let h = '<button class="s-head" style="padding:9px 0;min-height:44px" data-act="debt-row" data-id="'+esc(d.id)+'">'+
    '<span class="nm" style="font-size:14.5px">'+esc(d.name)+'</span>'+chip+
    '<span class="pill">≈ '+fmtT(c.remaining)+'</span><span class="ar" aria-hidden="true">›</span></button>';
  if(!EXPANDED.has("debt_"+d.id)) return h;

  let b = '<div style="padding:4px 0 12px;border-bottom:1px solid var(--line)">';
  b += '<p class="body">Закрыть сегодня ≈ '+fmtT(c.remaining)+'</p>';
  if(d.kind === "mfo" && d.penaltyDaily > 0){
    b += '<p class="mut">'+fmtT(d.balance)+' на '+fmtD(d.asOf)+' + пеня ≈'+fmtT(d.penaltyDaily)+'/день × '+c.days+' дн'+
      (c.paidAfter>0 ? ' − платежи '+fmtT(c.paidAfter) : '')+'</p>'+
      '<p class="tiny-note">Пеня — расчёт по твоей ставке. Точную цифру скажет МФО при закрытии.</p>';
  } else {
    b += '<p class="mut">остаток '+fmtT(d.balance)+' на '+fmtD(d.asOf)+(c.paidAfter>0 ? ' − платежи '+fmtT(c.paidAfter) : '')+'</p>';
    if(d.kind === "bank" && d.monthly && c.monthsLeft > 0){
      b += '<p class="mut">по графику ≈ '+fmtT(d.monthly)+' × '+c.monthsLeft+' мес = '+fmtT(c.schedule)+' · переплата ≈ '+fmtT(c.overpay)+'</p>';
    }
    if(d.rate) b += '<p class="tiny-note">ставка ~'+Math.round(d.rate)+'% — расчёт по платежу, в договоре может отличаться</p>';
  }
  if(d.note) b += '<p class="tiny-note">'+esc(d.note)+'</p>';
  if(!d.closedAt && (c.remaining === 0 || d.balance - c.paidAfter <= 0)){
    b += '<div class="note" style="margin-top:10px"><b>Похоже, он закрыт.</b>'+
      '<div class="btnrow"><button class="btn small" data-act="debt-close-ask" data-id="'+esc(d.id)+'">Закрыт полностью</button></div></div>';
  }
  /* платёж одной фазой */
  const payDef = d.kind === "mfo" ? String(c.remaining) : (d.monthly ? String(d.monthly) : "");
  b += '<input type="text" inputmode="numeric" id="pay_a_'+esc(d.id)+'" value="'+payDef+'" placeholder="Сумма, ₸">'+
    '<input type="date" id="pay_d_'+esc(d.id)+'" value="'+ctx.key+'">'+
    '<label class="payok"><input type="checkbox" id="pay_ok_'+esc(d.id)+'"> Списание видел</label>'+
    '<button class="btn small" data-act="debt-pay" data-id="'+esc(d.id)+'">Записать</button>'+
    '<p class="tiny-note">Твоё правило: без подтверждения не считается.</p>';
  /* история платежей */
  const pays = (d.pays||[]);
  if(pays.length){
    const showAll = EXPANDED.has("debtpays_"+d.id);
    const shown = showAll ? pays.slice().reverse() : pays.slice(-4).reverse();
    for(const p of shown){
      b += '<p class="dmono">'+fmtD(p.d)+' · '+fmtT(p.a)+' <button class="mini" data-act="debt-unpay" data-id="'+esc(d.id)+'" data-k="'+esc(p.d+"|"+p.a)+'">убрать</button></p>';
    }
    if(!showAll && pays.length > 4) b += '<div class="minirow"><button class="mini" data-act="expand" data-id="debtpays_'+esc(d.id)+'">вся история · '+pays.length+'</button></div>';
  }
  /* сверка */
  if(EXPANDED.has("debtfix_"+d.id)){
    b += '<input type="text" inputmode="numeric" id="fix_'+esc(d.id)+'" value="'+String(c.remaining)+'">'+
      '<button class="btn ghost small" data-act="debt-fix" data-id="'+esc(d.id)+'">Остаток на сегодня</button>'+
      '<p class="tiny-note">Цифра из приложения банка — она уже учитывает твои платежи.</p>';
  }
  b += '<div class="minirow">'+
    '<button class="mini" data-act="expand" data-id="debtfix_'+esc(d.id)+'">сверил остаток — исправить</button>'+
    '<button class="mini" data-act="debt-close-ask" data-id="'+esc(d.id)+'">закрыт полностью</button>'+
    '<button class="mini" data-act="debt-del" data-id="'+esc(d.id)+'">убрать долг</button></div>';
  return h + b + '</div>';
}

function debtsCards(ctx){
  const sm = debtsSummary(ctx.key);
  const queue = payoffOrder(sm.open);
  let h = "";

  /* --- Очередь --- */
  if(queue.length){
    const q0 = queue[0];
    h += '<div class="card">'+eyebrow("Долги · очередь","live")+
      '<p class="tiny-note" style="margin-top:0">остаток — на '+fmtD(q0.d.asOf)+' · обновляется, когда сверяешься</p>'+
      '<div class="action-box"><div class="cap">Следующий по очереди</div>'+
      '<p class="body" style="font-weight:600">'+esc(q0.d.name)+'</p>'+
      '<p class="body">закрыть сегодня ≈ '+fmtT(q0.c.remaining)+'</p>'+
      '<p class="mut" style="margin-top:6px">'+debtReason(q0)+'</p>'+
      '<button class="btn small" data-act="debt-goto" data-id="'+esc(q0.d.id)+'" data-kind="'+q0.d.kind+'">Провёл платёж</button></div>';
    if(queue.length > 1){
      let tail = "потом: "+esc(queue[1].d.name);
      if(queue.length > 2) tail += " · "+esc(queue[2].d.name);
      h += '<p class="tiny-note">'+tail+'</p>';
    }
    if(sm.burnOpen > 0){
      const k = sm.open.filter(x=> x.d.penaltyDaily > 0).length;
      h += '<p class="mut" style="margin-top:8px">пеня капает: ≈ '+fmtT(sm.burnOpen)+'/день по '+k+' МФО · '+
        '<button class="mini" data-act="debt-hod" data-h="penalty">что с этим делать</button></p>';
    }
    h += '</div>';
  }

  /* --- К нулю --- */
  h += '<div class="card">'+eyebrow("Долги · к нулю", sm.closedCount>0 ? (DEBT_FLASH?"ok flash":"ok") : "");
  let dots = "";
  const closedSorted = sm.closed.slice().sort((a,b)=> (a.d.closedAt||"") < (b.d.closedAt||"") ? -1 : 1);
  for(const x of closedSorted) dots += '<span class="dled on"></span>';
  for(const x of queue) dots += '<span class="dled"></span>';
  h += '<div class="dotrow">'+dots+'</div>';
  h += '<div class="stats" style="grid-template-columns:1fr 1fr">'+
    '<div class="stat"><div class="n">'+sm.closedCount+'</div><div class="l">закрыто из '+sm.totalCount+'</div></div>'+
    '<div class="stat"><div class="n" style="font-size:17px">'+fmtT(sm.totalPaid)+'</div><div class="l">выплачено</div></div></div>';
  if(sm.burnStopped > 0 && sm.burnOpen > 0)
    h += '<p class="mut" style="margin-top:10px">Пеня остановлена: ≈ '+fmtT(sm.burnStopped)+'/день — эти деньги больше не горят.</p>';
  if(sm.burnStopped > 0 && sm.burnOpen === 0)
    h += '<p class="mut" style="margin-top:10px">Пеня: 0 ₸/день. Ничего не горит. Остановлено: ≈ '+fmtT(sm.burnStopped)+'/день.</p>';
  h += '<p class="dmono" style="margin-top:10px">осталось ≈ '+fmtT(sm.totalRemaining)+(sm.totalAccrued>0 ? ' · в т.ч. пеня ≈ '+fmtT(sm.totalAccrued) : '')+'</p>'+
    '<p class="tiny-note">каждый остаток — на свою дату сверки; даты — в списке</p>';
  if(sm.instRemaining > 0)
    h += '<p class="tiny-note">из них рассрочки 0%: '+fmtT(sm.instRemaining)+' — не горят, идут по графику</p>';
  h += '</div>';
  DEBT_FLASH = false;

  /* --- Список: две свёрнутые группы + полка закрытых --- */
  h += '<div class="card">'+eyebrow("Долги · список");
  const groups = [
    {id:"debts_g_mfo",  name:"МФО",   items: queue.filter(x=> x.d.kind === "mfo")},
    {id:"debts_g_bank", name:"Банки", items: queue.filter(x=> x.d.kind === "bank")},
  ];
  for(const g of groups){
    if(!g.items.length) continue;
    const sum = g.items.reduce((a,x)=> a + x.c.remaining, 0);
    const open = EXPANDED.has(g.id);
    h += '<div class="s-item'+(open?" open":"")+'">'+
      '<button class="s-head" data-act="expand" data-id="'+g.id+'"><span class="nm">'+g.name+' · '+g.items.length+'</span>'+
      '<span class="pill">≈ '+fmtT(sum)+'</span><span class="ar" aria-hidden="true">›</span></button>'+
      '<div class="s-body">'+(open ? g.items.map(x=> debtRowHtml(x, ctx)).join("") : "")+'</div></div>';
  }
  if(sm.closed.length){
    const open = EXPANDED.has("debts_g_closed");
    h += '<div class="s-item'+(open?" open":"")+'">'+
      '<button class="s-head" data-act="expand" data-id="debts_g_closed"><span class="nm">Закрытые · '+sm.closed.length+'</span>'+
      '<span class="pill">'+fmtT(sm.paidClosed)+'</span><span class="ar" aria-hidden="true">›</span></button>'+
      '<div class="s-body">';
    if(open){
      for(const x of closedSorted){
        let fact = "";
        if(x.d.penaltyDaily > 0) fact = " Пеня ≈"+fmtT(x.d.penaltyDaily)+"/день остановлена.";
        else if(x.d.monthly) fact = " Платёж "+fmtT(x.d.monthly)+"/мес свободен.";
        h += '<div class="p-row"><span class="p-name thin">'+esc(x.d.name)+' · закрыт '+fmtD(x.d.closedAt)+'.'+fact+'</span>'+
          '<span class="pill">'+fmtT(x.c.paidTotal)+'</span>'+
          '<button class="mini" data-act="debt-del" data-id="'+esc(x.d.id)+'">убрать</button></div>';
      }
    }
    h += '</div></div>';
  }
  h += '</div>';

  /* --- Ходы --- */
  h += '<div class="card">'+eyebrow("Долги · ходы","quiet")+
    '<p class="mut">Это не советы — это двери. Они существуют, даже если ни одну не откроешь.</p>';
  for(const c of HODY){
    const open = EXPANDED.has(c.id);
    h += '<div class="s-item'+(open?" open":"")+'">'+
      '<button class="s-head" data-act="expand" data-id="'+c.id+'"><span class="nm" style="font-size:14.5px">'+c.t+'</span><span class="ar" aria-hidden="true">›</span></button>'+
      '<div class="s-body">'+c.steps.map((st,i)=> i === c.steps.length-1 && st.indexOf("Что уточнить") === 0
        ? '<p class="tiny-note">'+st+'</p>' : '<p class="mut" style="margin-top:10px">'+st+'</p>').join("")+'</div></div>';
  }
  h += '<p class="tiny-note">Если давит не долг, а голова — аптечка во вкладке «Я». Она для этого и лежит.</p></div>';

  return h;
}

function debtsDataCardHtml(){

  const k = (S.debts||[]).filter(d=> d.closedAt).length;
  let h = '<div class="card">'+eyebrow("Долги · данные");
  if(!n){
    h += '<p class="mut">Здесь пусто — и в коде приложения твоих цифр нет и не будет. Приложение лежит в открытом репозитории, поэтому данные заезжают только с этого телефона: вставь строку из бота или добавь долг руками. Никуда не уходят, ни к чему не подключаются.</p>';
  } else {
    h += '<p class="mut">Долгов: '+n+', закрытых: '+k+'. Всё лежит только на этом телефоне.</p>';
  }
  h += '<textarea class="backup-box" id="debtsta" placeholder="Вставь строку из бота..."></textarea>'+
    '<div class="btnrow"><button class="btn small" data-act="debts-preview">Проверить</button>'+
    '<button class="btn ghost small" data-act="expand" data-id="debtadd">Добавить руками</button></div>';
  if(DEBTS_PREVIEW){
    h += '<div class="note" style="margin-top:12px"><p class="mut">'+esc(DEBTS_PREVIEW.text)+'</p>'+
      '<div class="btnrow"><button class="btn small" data-act="debts-merge">Добавить</button>'+
      '<button class="btn quiet small" data-act="debts-cancel">отмена</button></div></div>';
  }
  if(EXPANDED.has("debtadd")){
    h += '<input type="text" id="dadd-name" placeholder="Кому должен" maxlength="40">'+
      '<select id="dadd-kind"><option value="bank">Банк</option><option value="mfo">МФО</option></select>'+

      '<input type="text" inputmode="numeric" id="dadd-pen" placeholder="Пеня, ₸/день — если капает">'+
      '<input type="text" inputmode="numeric" id="dadd-rate" placeholder="Ставка, % годовых — если знаешь">'+

  }
  if(n) h += '<div class="minirow"><button class="mini" data-act="debts-wipe">стереть данные модуля</button></div>';
  return h + '</div>';
}

let QUIET_PICK = false, PAUSE_PICK = false;

function pickerHtml(){
  if(QUIET_PICK){
    const cur = quietActive(CTX);
    return '<div class="note"><b>На сколько убавить?</b>'+
      (cur ? '<p class="mut" style="margin-top:4px">Тихий режим сейчас включён'+(S.mode.until?" до "+fmtDate(S.mode.until):" бессрочно")+'.</p>' : '')+
      '<div class="btnrow"><button class="btn small" data-act="quiet-set" data-d="3">3 дня</button>'+
      '<button class="btn small" data-act="quiet-set" data-d="7">7 дней</button>'+
      '<button class="btn small" data-act="quiet-set" data-d="14">14 дней</button>'+
      '<button class="btn ghost small" data-act="quiet-set" data-d="0">пока не выключу</button></div>'+
      '<div class="btnrow">'+(cur?'<button class="btn quiet small" data-act="quiet-off">Вернуть обычный день</button>':'')+
      '<button class="btn quiet small" data-act="pick-cancel">отмена</button></div></div>';
  }
  if(PAUSE_PICK){
    return '<div class="note"><b>Поставить пульт на паузу?</b><p class="mut" style="margin-top:4px">Приложения не будет. Ни вопросов, ни карточек, ни слова о том, сколько дней прошло.</p>'+
      '<div class="btnrow"><button class="btn small" data-act="pause-set" data-d="7">7 дней</button>'+

      '<button class="btn quiet small" data-act="pick-cancel">отмена</button></div></div>';
  }
  return "";
}

function screenSig(){
  const h = new Date().getHours();
  const ph = (h>=17||h<5) ? "e" : (h<12 ? "m" : "d");
  return todayKey()+"|"+ph+"|"+((h>=21||h<5)?"s":"")+"|"+((h>=23||h<5)?"n":"")+"|"+(h<12?"p":"");
}

function render(){
  CTX = makeCtx();
  RENDERED_SIG = screenSig();
  const app = $("#app");
  try{
    $("#tabs").innerHTML = TABS.map(t=>
      '<button class="tab" role="tab" data-act="tab" data-id="'+t.id+'" aria-selected="'+(TAB===t.id)+'">'+
      '<span class="ico" aria-hidden="true">'+t.ico+'</span>'+t.name+'</button>').join("");
    if(pausedActive(CTX)){ app.innerHTML = saveAlarmHtml() + viewPaused(CTX); return; }
    let h = saveAlarmHtml() + pickerHtml();   /* плашка сбоя записи — на любой вкладке, первым элементом */
    if(TAB === "today") h += viewToday();
    else if(TAB === "path") h += viewPath();
    else if(TAB === "journal") h += viewJournal();
    else h += viewMe();
    app.innerHTML = h;
  }catch(e){
    try{ app.innerHTML = crashScreen(e); }catch(e2){}
    if(window.console) console.error(e);
  }
}
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ================= ДЫХАНИЕ ================= */

let wakeLock = null;
async function askWake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
function dropWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
function breathTick(){
  if(!BREATH || !BREATH.on) return;
  BREATH.t--;
  if(BREATH.t <= 0){
    if(BREATH.phase === "in"){ BREATH.phase = "out"; BREATH.t = 6; }
    else { BREATH.phase = "in"; BREATH.t = 4; BREATH.left--; }
  }
  if(BREATH.left <= 0){ stopBreath(); rerender(); return; }
  const cap = $("#breath-cap");
  if(cap) cap.textContent = (BREATH.phase === "in" ? "вдох "+BREATH.t : "выдох "+BREATH.t)+" · осталось "+BREATH.left;
}
function startBreath(){
  BREATH = {on:true, phase:"in", t:4, left:12, timer:setInterval(breathTick, 1000)};
  askWake();
}
function stopBreath(){ if(BREATH && BREATH.timer) clearInterval(BREATH.timer); BREATH = null; dropWake(); }

function commit(msg){ const ok = save(); if(ok && msg) toast(msg); return ok; }
function markToast(msg){ toast(msg); }

    try{
      const o = JSON.parse(v);
      if(!o || typeof o !== "object" || !o.days) throw new Error("bad");
      let inDays = 0, inRec = 0, fresh = 0;
      for(const k in o.days){
        inDays++;
        if(o.days[k] && o.days[k].answer) inRec++;
        if(!S.days[k]) fresh++;
      }
      inRec += Object.keys(o.weeks||{}).length;   /* как в stats(): прогоны недель тоже записи */
      for(const k in o.days){ const r = o.days[k]; if(r && r.weekly && !(o.weeks||{})[weekKeyOf(k)]) inRec++; }
      const mine = stats();
      const myDays = Object.keys(S.days).length;
      let dtxt = "";
      if(Array.isArray(o.debts) && o.debts.length) dtxt = " Долгов в копии: "+o.debts.length+".";
      RESTORE_PREVIEW = {data:o, text:"В копии "+nDays(inDays)+" и "+nRec(inRec)+". У тебя "+nDays(myDays)+" и "+nRec(mine.records)+". Новых дней придёт: "+fresh+"."+dtxt+" Ничего не будет удалено."};

  "restore-merge"(){
    if(!RESTORE_PREVIEW) return;
    const o = RESTORE_PREVIEW.data;
    for(const k in o.days) if(!S.days[k]) S.days[k] = normalizeDay(o.days[k]);
    for(const w in (o.weeks||{})) if(!S.weeks[w]) S.weeks[w] = o.weeks[w];
    (o.people||[]).forEach(p=>{ if(p && p.name && S.people.length<7 && !S.people.some(x=>x.name===p.name)) S.people.push(p); });
    (o.customMissions||[]).forEach(m=>{ if(m && m.text && !S.customMissions.some(x=>x.text===m.text)) S.customMissions.push(m); });
    (o.customQuestions||[]).forEach(q=>{ if(q && S.customQuestions.indexOf(q)<0) S.customQuestions.push(q); });
    if(o.rider && o.rider.helps && !S.rider.helps) S.rider = o.rider;
    if(Array.isArray(o.debts)) mergeDebts(normalizeDebts(o.debts));
    S.idsV = 0; migrateIds();   /* дни из старой копии могли прийти с позиционными ключами m0/m1 */

    let lost = 0;
    for(const k in S.days) if(!o.days[k]) lost++;
    if(!window.confirm("Заменить всё целиком? Потеряешь "+nDays(lost)+", которых нет в копии.")) return;
    let snapOk = false;
    try{ localStorage.setItem(SNAP_KEY, JSON.stringify({at:Date.now(), data:S})); snapOk = true; }catch(e){}
    if(!snapOk && !window.confirm("Снимок для отката сохранить не удалось. Заменить БЕЗ возможности отката?")) return;
    S = fill(o); S.idsV = 0; migrateIds();
    RESTORE_PREVIEW = null; save(); render(); window.scrollTo(0,0);
    markToast("Заменено");
  },
  "undo-replace"(){
    /* Откат — обратимый свап с подтверждением: текущее состояние встаёт на место снимка. */
    let raw = null;
    try{ raw = localStorage.getItem(SNAP_KEY); }catch(e){}
    if(!raw) return;
    let snap;
    try{ snap = JSON.parse(raw); }catch(e){ markToast("Снимок повреждён"); return; }
    const data = (snap && snap.data) ? snap.data : snap;   /* поддержка старого формата: голый S */
    const when = (snap && snap.at) ? fmtDate(new Date(snap.at).toISOString().slice(0,10)) : "неизвестной даты";
    if(!window.confirm("Вернуть состояние на момент замены ("+when+")? Текущие данные встанут на его место — откат можно будет повторить.")) return;
    let cur = null;
    try{ cur = JSON.stringify({at:Date.now(), data:S}); }catch(e){}
    let newS;
    try{ newS = fill(data); }catch(e){ markToast("Снимок повреждён"); return; }
    S = newS; S.idsV = 0; migrateIds();
    try{ if(cur) localStorage.setItem(SNAP_KEY, cur); }catch(e){}
    save(); render(); window.scrollTo(0,0); markToast("Вернули. Свап можно повторить.");
  },
  "broken-try"(d){
    let raw = null;
    try{ raw = localStorage.getItem(d.k); }catch(e){}
    if(!raw) return;
    try{
      const o = JSON.parse(raw);
      if(!o || typeof o !== "object" || !o.days) throw new Error("bad");
      let inDays = 0, inRec = 0, fresh = 0;
      for(const k in o.days){ inDays++; if(o.days[k] && o.days[k].answer) inRec++; if(!S.days[k]) fresh++; }
      const mine = stats();
      RESTORE_PREVIEW = {data:o, text:"В копии "+nDays(inDays)+" и "+nRec(inRec)+". У тебя "+nDays(Object.keys(S.days).length)+" и "+nRec(mine.records)+". Новых дней придёт: "+fresh+". Ничего не будет удалено."};
      rerender();
    }catch(e){ markToast("Копия не читается — выгрузи её файлом"); }
  },
  "broken-share"(d){
    let raw = null;
    try{ raw = localStorage.getItem(d.k); }catch(e){}
    if(!raw) return;
    try{
      const f = new File([raw], "pult-broken.txt", {type:"text/plain"});
      if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:"Спасённая копия Пульта"}).catch(()=>{}); return; }
    }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(raw).then(()=>markToast("Скопировано"), ()=>{});
  },
  "broken-del"(d){
    if(!window.confirm("Удалить спасённую копию? Вернуть будет нельзя.")) return;
    try{ localStorage.removeItem(d.k); }catch(e){}
    rerender();
  },

  "ret-back"(){ const rec = day(CTX.key); rec.returned = true; save(); render(); window.scrollTo(0,0); },
  "ret-normal"(){ const rec = day(CTX.key); rec.returnSeen = true; save(); render(); window.scrollTo(0,0); },
  "rb-keep"(d){ RB[d.k] = !RB[d.k]; rerender(); },
  /* ================= ДОЛГИ: действия =================
     Мутации только пяти видов: pays.push / pays.splice (undo) / balance+asOf (сверка) /
     closedAt (закрытие) / splice долга. Каждая уменьшающая — через window.confirm. */
  "debts-preview"(){
    const v = val("#debtsta");
    if(!v){ markToast("Вставь строку в поле выше"); return; }
    if(v.length > 500000){ markToast("Строка слишком длинная — это точно экспорт долгов?"); return; }
    let o;
    try{ o = JSON.parse(v); }catch(e){ markToast("Это не похоже на строку с долгами"); return; }
    let raw = Array.isArray(o) ? o : (o && Array.isArray(o.debts) ? o.debts : null);
    const list = normalizeDebts(raw || []);
    if(!list.length){ markToast("Это не похоже на строку с долгами"); return; }
    const n = list.length;
    const k = list.filter(d=> d.closedAt).length;
    let p = 0; for(const d of list) p += d.pays.length;
    let m = 0, u = 0;
    for(const d of list){ (S.debts||[]).some(x=> x.id === d.id) ? u++ : m++; }
    DEBTS_PREVIEW = {list, text:"В строке "+n+" долгов ("+k+" закрытых), платежей: "+p+". Новых: "+m+", обновятся: "+u+". Ничего не будет удалено."};
    rerender();
  },
  "debts-cancel"(){ DEBTS_PREVIEW = null; rerender(); },
  "debts-merge"(){
    if(!DEBTS_PREVIEW) return;
    const list = DEBTS_PREVIEW.list;
    mergeDebts(list);
    const n = list.length, k = list.filter(d=> d.closedAt).length;
    DEBTS_PREVIEW = null;
    commit(S.off.debts
      ? "Заехало: "+n+" долгов. Модуль выключен — включи выше, когда захочешь видеть."
      : "Заехало: "+n+" долгов, закрытых: "+k+".");
    rerender();
  },
  "debt-add"(){
    const name = val("#dadd-name");
    const bal = parseInt(val("#dadd-bal").replace(/[^\d]/g,""), 10);
    if(!name || !isFinite(bal)){ markToast("Нужны хотя бы имя и остаток"); return; }
    const kindEl = $("#dadd-kind");
    const num = id => { const x = parseInt(val(id).replace(/[^\d.,]/g,"").replace(",","."), 10); return isFinite(x) && x > 0 ? x : null; };
    const fnum = id => { const x = parseFloat(val(id).replace(/[^\d.,]/g,"").replace(",",".")); return isFinite(x) && x > 0 ? x : 0; };
    const dt = id => { const v = val(id); return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null; };
    S.debts.push(normalizeDebts([{
      id: "m"+Date.now().toString(36),
      name, kind: kindEl ? kindEl.value : "bank",
      balance: bal, asOf: dt("#dadd-asof") || CTX.key,
      monthly: num("#dadd-monthly"), endDate: dt("#dadd-end"),
      rate: fnum("#dadd-rate") || null, penaltyDaily: fnum("#dadd-pen"),
      note: val("#dadd-note"), pays: [], closedAt: null,
    }])[0]);
    EXPANDED.delete("debtadd");
    commit("Добавлен"); rerender();
  },
  "debts-wipe"(){
    if(!window.confirm("Стереть все долги и платежи из Пульта? Бота на компе это не тронет.")) return;
    S.debts = []; save(); markToast("Стёрто"); rerender();
  },
  "debt-goto"(d){
    EXPANDED.add("debts_g_"+(d.kind === "mfo" ? "mfo" : "bank"));
    EXPANDED.add("debt_"+d.id);
    rerender();
    const el = document.querySelector('[data-act="debt-row"][data-id="'+(window.CSS && CSS.escape ? CSS.escape(d.id) : d.id)+'"]');
    if(el) el.scrollIntoView({block:"start"});
  },
  "debt-hod"(d){
    EXPANDED.add("hod_"+d.h);
    rerender();
    const el = document.querySelector('[data-id="hod_'+d.h+'"]');
    if(el) el.scrollIntoView({block:"start"});
  },
  "debt-row"(d){
    EXPANDED.has("debt_"+d.id) ? EXPANDED.delete("debt_"+d.id) : EXPANDED.add("debt_"+d.id);
    rerender();
  },
  "debt-pay"(d){
    const debt = (S.debts||[]).find(x=> x.id === d.id); if(!debt) return;
    const a = parseInt(val("#pay_a_"+d.id).replace(/[^\d]/g,""), 10);
    if(!a || a <= 0){ markToast("Нужна сумма в тенге"); return; }
    let d8 = val("#pay_d_"+d.id);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d8)) d8 = CTX.key;
    const ok = $("#pay_ok_"+d.id);
    if(!ok || !ok.checked){ markToast("Отметь «списание видел» — без этого не считается"); return; }
    debt.pays.push({d:d8, a:Math.round(a)});
    debt.pays.sort((x,y)=> x.d < y.d ? -1 : x.d > y.d ? 1 : 0);
    commit("Записано: "+fmtT(a)); rerender();
  },
  "debt-fix"(d){
    const debt = (S.debts||[]).find(x=> x.id === d.id); if(!debt) return;
    const v = parseInt(val("#fix_"+d.id).replace(/[^\d]/g,""), 10);
    if(!isFinite(v) || v < 0){ markToast("Нужна сумма в тенге"); return; }
    debt.balance = Math.round(v);
    debt.asOf = CTX.key;
    EXPANDED.delete("debtfix_"+d.id);
    commit("Остаток обновлён на "+fmtD(CTX.key)); rerender();
  },
  "debt-close-ask"(d){
    const debt = (S.debts||[]).find(x=> x.id === d.id); if(!debt || debt.closedAt) return;
    if(!window.confirm("«"+debt.name+"» закрыт полностью? Он уедет в «Закрытые» и выйдет из очереди.")) return;
    debt.closedAt = CTX.key;
    DEBT_FLASH = true;
    EXPANDED.delete("debt_"+d.id);
    const left = (S.debts||[]).filter(x=> !x.closedAt).length;
    commit("Минус один. Осталось "+left+"."); rerender();
  },
  "debt-unpay"(d){
    const debt = (S.debts||[]).find(x=> x.id === d.id); if(!debt) return;
    const sep = d.k.lastIndexOf("|");
    const pd = d.k.slice(0, sep), pa = Number(d.k.slice(sep+1));
    if(!window.confirm("Убрать платёж "+fmtT(pa)+" от "+fmtD(pd)+"? Он выйдет из всех счётчиков.")) return;
    const i = debt.pays.findIndex(p=> p.d === pd && p.a === pa);
    if(i >= 0) debt.pays.splice(i, 1);
    commit("Убрано"); rerender();
  },
  "debt-del"(d){
    const i = (S.debts||[]).findIndex(x=> x.id === d.id); if(i < 0) return;
    if(!window.confirm("Убрать «"+S.debts[i].name+"» совсем? Его платежи уйдут из всех счётчиков.")) return;
    S.debts.splice(i, 1);
    commit("Убрано"); rerender();
  },

  rebuild(){
    if(!RB.missions) S.customMissions = [];
    if(!RB.questions) S.customQuestions = [];
    if(!RB.people) S.people = [];
    const rec = day(CTX.key);
    rec.returned = true;
    delete rec.setlist;
    commit("Собрано заново. Дневник цел."); render(); window.scrollTo(0,0);
  },
};

/* Делегирование: один слушатель на весь экран вместо перевешивания onclick */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const fn = ACTIONS[act];
  if(!fn) return;
  e.preventDefault();
  try{ fn(el.dataset, el); }
  catch(err){ if(window.console) console.error(err); toast("Что-то пошло не так"); }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest && e.target.closest('[data-act="mission"]');
  if(!el) return;
  e.preventDefault();
  ACTIONS.mission(el.dataset, el);
});
document.addEventListener("input", function(e){
  const t = e.target;
  if(t.id === "j-search"){ J_SEARCH = t.value; J_LIMIT = 30;
    const pos = t.selectionStart; rerender();
    const n = $("#j-search"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  if(t.dataset && t.dataset.draft){
    setDraft(t.dataset.draft, t.value, t.dataset.scope);
    const ind = $("#draft-"+t.dataset.draft);
    if(ind){ ind.textContent = "черновик сохранён"; clearTimeout(ind._t); ind._t = setTimeout(()=>{ ind.textContent = ""; }, 1500); }
  }
});
document.addEventListener("focusin", function(e){
  const t = e.target;
  if(t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && (t.type === "text" || t.type === "search")))
    setTimeout(()=>{ try{ t.scrollIntoView({block:"center", behavior:"smooth"}); }catch(err){} }, 250);
});
document.addEventListener("focusout", function(){
  if(PENDING_RERENDER){ PENDING_RERENDER = false; setTimeout(()=>{ render(); }, 60); }
});

/* ================= КЛАВИАТУРА ================= */

(function(){
  const vv = window.visualViewport;
  if(!vv) return;
  const upd = ()=>{
    const gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", gap+"px");
    const nav = $("#nav");
    if(nav) nav.classList.toggle("hidden", gap > 80);
  };
  vv.addEventListener("resize", upd);
  vv.addEventListener("scroll", upd);
  upd();
})();

/* ================= СМЕНА КОНТЕКСТА ================= */

function checkContext(){
  if(!RENDERED_SIG || RENDERED_SIG === screenSig()) return;
  const ae = document.activeElement;
  if(ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT") && String(ae.value||"").trim()){ PENDING_RERENDER = true; return; }
  EXPANDED.clear(); EDITING = {}; SHOW_ALL = false;
  SHOW_ALL_TASKS = false; PICK_I = 0; ARCH_I = 0;   /* сессионные выборы вчерашнего дня не переживают его */
  WORDS_OPEN = false; STARTS_OPEN = false; WORDS_G = -1;
  render(); window.scrollTo(0,0);
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible"){ checkContext(); if(BREATH && BREATH.on) askWake(); } });
window.addEventListener("pageshow", checkContext);
window.addEventListener("pagehide", dropWake);
setInterval(checkContext, 60000);

/* ================= СТАРТ ================= */

try{
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().then(ok=>{ if(S.persisted !== !!ok){ S.persisted = !!ok; save(); } }).catch(()=>{});
  }
}catch(e){}

try{ migrateIds(); }catch(e){ if(window.console) console.error(e); }
try{ sweepDrafts(); }catch(e){ if(window.console) console.error(e); }

function applyHash(){
  const h = (location.hash||"").replace("#","");
  if(h === "question") EXPANDED.add("q");
  if(h === "sleep") EXPANDED.add("night");
  render();
  const map = {soundcheck:"#card-sc", question:"#card-q", sleep:"#card-night"};
  const el = map[h] && document.querySelector(map[h]);
  if(el) el.scrollIntoView({block:"start"});
}
applyHash();
window.addEventListener("hashchange", applyHash);
</script>
